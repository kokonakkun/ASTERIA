name: Build Windows portable

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build portable EXE
        run: npm run build:portable

      - name: Create checksum
        shell: pwsh
        run: |
          $artifact = Get-ChildItem -LiteralPath dist -Filter "*-portable.exe" | Select-Object -First 1
          if (-not $artifact) { throw "Portable EXE was not created." }
          $hash = (Get-FileHash -LiteralPath $artifact.FullName -Algorithm SHA256).Hash
          "$hash  $($artifact.Name)" | Set-Content -LiteralPath dist\SHA256SUMS.txt -Encoding ascii

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: ASTERIA-Windows-portable
          path: |
            dist/*-portable.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $artifact = Get-ChildItem -LiteralPath dist -Filter "*-portable.exe" | Select-Object -First 1
          $notes = "release-notes/$env:GITHUB_REF_NAME.md"
          if (-not (Test-Path -LiteralPath $notes)) { $notes = "CHANGELOG.md" }
          gh release create $env:GITHUB_REF_NAME $artifact.FullName dist\SHA256SUMS.txt `
            --title "ASTERIA $($env:GITHUB_REF_NAME.TrimStart('v'))" `
            --notes-file $notes `
            --verify-tag
